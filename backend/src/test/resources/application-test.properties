spring.application.name=citizen-service-management-test

# H2 In-Memory Database for automated tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 JPA settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File Upload Limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# JWT Configuration
app.jwt.secret=TestSecretKeyForTestingPurposesMustBeAtLeast32CharactersLong!
app.jwt.expiration=3600000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173

# Admin Seeder
app.admin.email=admin@test.com
app.admin.password=AdminTestPass123
