spring.application.name=citizen-service-management
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/citizen_service_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File Upload Limits (Strict 2MB as required)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# JWT Configuration
app.jwt.secret=${JWT_SECRET:CitizenServiceRequestSystemSuperSecureSecretKey1234567890}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Initial Admin Seeder Properties
app.admin.email=${INITIAL_ADMIN_EMAIL:admin@example.com}
app.admin.password=${INITIAL_ADMIN_PASSWORD:Admin@123}
